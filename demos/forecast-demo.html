ium)",body:g.jsxs(g.Fragment,{children:[g.jsx("p",{children:"Quick Buy/Sell fills immediately by first eating through whatever the order book can actually offer at the best available prices, then -- for any quantity the book can't cover -- synthetically filling the rest at the last traded price plus or minus a flat 10% premium (buys pay +10%, sells receive -10%)."}),g.jsx(Jc,{items:["The 10% premium only applies to the leftover quantity the book couldn’t fill -- not the whole order.","No price ever executes below the $1.00 floor, no matter how beaten-down a player’s stock is.","Use it when you need a fill right now and don’t want to wait on the book."]})]})},{heading:"Fees",body:g.jsxs("div",{className:"space-y-1.5",children:[g.jsx("p",{children:'Only the "taker" -- whoever’s order actually crosses and executes, whether that’s a limit order that crosses the book or a quick trade -- pays a transaction fee, charged once on the total value of everything that order fills.'}),g.jsx(pa,{label:"Transaction fee (taker only)",value:"0.25%"}),g.jsx(pa,{label:"Quick trade premium (unfilled remainder)",value:"±10%"}),g.jsx(pa,{label:"Price floor",value:"$1.00 / share"})]})}]},dividends:{emoji:"💰",title:"How Dividends Work",intro:"When a player you own shares in places well in a tournament, real cash flows to every current shareholder -- split proportionally by how many shares they hold.",sections:[{heading:"Where the money comes from",body:g.jsxs("div",{className:"space-y-1.5",children:[g.jsx("p",{children:"Each tournament type draws from its own fixed prize pool, split up by placement:"}),g.jsx(pa,{label:"Cash Cup pool",value:"$300,000"}),g.jsx(pa,{label:"FNCS Qualifier / Finals pool",value:"$1,500,000"}),g.jsx(pa,{label:"Global Championship pool",value:"$3,000,000"})]})},{heading:"How placement decides the payout",body:g.jsxs(g.Fragment,{children:[g.jsx("p",{children:"Each placement is worth a fixed slice of that tournament’s pool -- 1st place earns 20% of it, 2nd earns 13%,
